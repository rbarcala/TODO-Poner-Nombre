<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poner nombre copado - Menu Principal</title>
    
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center font-sans text-white relative">

    <video autoplay loop muted playsinline class="absolute top-0 left-0 w-full h-full object-cover z-0">
        <source src="./assets/fondo.mp4" type="video/mp4">
        Tu navegador no soporta videos HTML5.
    </video>

    <div class="absolute top-0 left-0 w-full h-full bg-black/65 z-10"></div>

    <main class="relative z-20 flex flex-col items-center space-y-8 bg-slate-950/80 p-12 rounded-xl border border-slate-800 shadow-2xl backdrop-blur-md max-w-md w-full mx-4">
        
        <div class="text-center">
            <h1 class="text-5xl font-extrabold tracking-wider text-red-600 uppercase drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
                Poner nombre copado
            </h1>
            <p class="text-slate-400 tracking-widest text-xs uppercase mt-2 font-semibold">
                TODO-Poner-Nombre
            </p>
        </div>

        <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-slate-700 to-transparent"></div>

        <div class="flex flex-col w-full space-y-4">
            <button class="group relative bg-red-700 hover:bg-red-600 text-white font-bold py-3.5 px-6 rounded-lg transition-all duration-200 uppercase tracking-wider text-sm shadow-lg shadow-red-900/40 active:scale-[0.98]">
                Nueva Partida
            </button>

            <button class="bg-transparent hover:bg-red-950/30 text-slate-500 hover:text-red-400 font-bold py-2 px-6 rounded-lg transition-all duration-200 uppercase tracking-wider text-xs active:scale-[0.98]">
                Salir del Juego
            </button>
        </div>

    </main>

    <script src="./js/main.js"></script>
</body>
</html>
