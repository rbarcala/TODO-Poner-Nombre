<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle of conquest - Menu Principal</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center font-sans text-white relative">
    <video autoplay loop muted playsinline class="absolute top-0 left-0 w-full h-full object-cover z-0">
        <source src="./assets/fondo.mp4" type="video/mp4">
        Tu navegador no soporta videos HTML5.
    </video>

    <div class="absolute top-0 left-0 w-full h-full bg-black/65 z-10"></div>

    <main class="relative z-20 flex flex-col items-center space-y-8 bg-slate-950/80 p-12 rounded-xl border border-slate-800 shadow-2xl backdrop-blur-md max-w-md w-full mx-4">
        <div class="text-center">
            <h1 class="text-5xl font-extrabold tracking-wider text-red-600 uppercase drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
                Circle of Conquest
            </h1>
            <p class="text-slate-400 tracking-widest text-xs uppercase mt-2 font-semibold">
                By: TODO-Poner-Nombre
            </p>
        </div>

        <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-slate-700 to-transparent"></div>

        <div class="flex flex-col w-full space-y-4">
            <div class="flex gap-3">
                <button data-action="play" class="group relative flex-1 bg-red-700 hover:bg-red-600 text-white font-bold py-3.5 px-6 rounded-lg transition-all duration-200 uppercase tracking-wider text-sm shadow-lg shadow-red-900/40 active:scale-[0.98]">
                    Jugar
                </button>
                <button data-action="admin" class="group relative flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 px-6 rounded-lg transition-all duration-200 uppercase tracking-wider text-sm shadow-lg shadow-slate-900/40 active:scale-[0.98] border border-slate-700">
                    Administrar
                </button>
            </div>
        </div>
    </main>

    <div id="game-modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/90 p-4">
        <div class="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900/95 p-6 shadow-2xl">
            <h2 class="text-2xl font-semibold text-red-500">Nueva partida</h2>
            <p id="game-modal-description" class="mt-2 text-sm text-slate-400">Seleccioná hasta 4 países para participar.</p>
            <div id="country-selector" class="mt-4 max-h-64 space-y-2 overflow-auto pr-1"></div>
            <div class="mt-6 flex justify-center gap-3">
                <button id="start-game-btn" class="rounded-lg bg-red-700 px-4 py-2 font-semibold hover:bg-red-600">Comenzar</button>
                <button id="cancel-game-btn" class="rounded-lg bg-slate-700 px-4 py-2 font-semibold hover:bg-slate-600">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
