<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Entidades</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-white">
    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-red-500">Editor de entidades</h1>
                <p class="text-slate-400">Gestiona países, tipos de tropas y tipos de terreno.</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="clear-games-btn" type="button" class="bg-red-900 hover:bg-red-800 px-4 py-2 rounded">Limpiar partidas</button>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded">Volver</a>
            </div>
        </div>

        <section class="grid gap-6 lg:grid-cols-3">
            <article class="bg-slate-900/80 rounded-xl border border-slate-800 p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold">Países</h2>
                    <button data-entity="paises" class="add-btn bg-red-700 hover:bg-red-600 px-3 py-2 rounded text-sm">Agregar</button>
                </div>
                <form id="form-paises" class="space-y-3 hidden">
                    <input type="hidden" name="id">
                    <input name="nombre" placeholder="Nombre" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <select name="color_hex" class="w-full rounded px-3 py-2 bg-slate-800" required>
                        <option value="" disabled selected>Seleccionar color...</option>
                    </select>
                    <input name="economia" type="number" min="1" max="10" step="1" placeholder="Economía (1 a 10)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <input name="tecnologia" type="number" min="1" max="10" step="1" placeholder="Tecnología (1 a 10)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <input name="agresividad" type="number" min="1" max="10" step="1" placeholder="Agresividad (1 a 10)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <select name="terreno_id" class="w-full rounded px-3 py-2 bg-slate-800"></select>
                    <div class="flex gap-2">
                        <button type="submit" class="bg-red-700 px-3 py-2 rounded cursor-pointer">Guardar</button>
                        <button type="button" data-action="cancel" class="cancel-btn bg-slate-700 px-3 py-2 rounded cursor-pointer">Cancelar</button>
                    </div>
                </form>
                <div id="list-paises" class="space-y-2"></div>
            </article>

            <article class="bg-slate-900/80 rounded-xl border border-slate-800 p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold">Tipos de tropas</h2>
                    <button data-entity="tropas" class="add-btn bg-red-700 hover:bg-red-600 px-3 py-2 rounded text-sm">Agregar</button>
                </div>
                <form id="form-tropas" class="space-y-3 hidden">
                    <input type="hidden" name="id">
                    <input name="tipo" placeholder="Tipo" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <input name="descripcion" placeholder="Descripción" class="w-full rounded px-3 py-2 bg-slate-800">
                    <input name="dado_min" type="number" min="1" max="99" step="1" placeholder="Dado mínimo (1 a 99)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <input name="dado_max" type="number" min="1" max="99" step="1" placeholder="Dado máximo (1 a 99)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <input name="costo" type="number" min="1" max="99" step="1" placeholder="Costo (1 a 99)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <div class="flex gap-2">
                        <button type="submit" class="bg-red-700 px-3 py-2 rounded cursor-pointer">Guardar</button>
                        <button type="button" data-action="cancel" class="cancel-btn bg-slate-700 px-3 py-2 rounded cursor-pointer">Cancelar</button>
                    </div>
                </form>
                <div id="list-tropas" class="space-y-2"></div>
            </article>

            <article class="bg-slate-900/80 rounded-xl border border-slate-800 p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold">Tipos de terreno</h2>
                    <button data-entity="terrenos" class="add-btn bg-red-700 hover:bg-red-600 px-3 py-2 rounded text-sm">Agregar</button>
                </div>
                <form id="form-terrenos" class="space-y-3 hidden">
                    <input type="hidden" name="id">
                    <input name="nombre" placeholder="Nombre" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <input name="descripcion" placeholder="Descripción" class="w-full rounded px-3 py-2 bg-slate-800">
                    <select name="color_hex" class="w-full rounded px-3 py-2 bg-slate-800" required>
                        <option value="" disabled selected>Seleccionar color...</option>
                    </select>
                    <input name="modificador_ataque" type="number" min="0.50" max="1.50" step="0.01" placeholder="Modificador ataque (0,50 a 1,50)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <input name="modificador_defensa" type="number" min="0.50" max="1.50" step="0.01" placeholder="Modificador defensa (0,50 a 1,50)" class="w-full rounded px-3 py-2 bg-slate-800" required>
                    <div class="flex gap-2">
                        <button type="submit" class="bg-red-700 px-3 py-2 rounded cursor-pointer">Guardar</button>
                        <button type="button" data-action="cancel" class="cancel-btn bg-slate-700 px-3 py-2 rounded cursor-pointer">Cancelar</button>
                    </div>
                </form>
                <div id="list-terrenos" class="space-y-2"></div>
            </article>
        </section>
    </main>

    <script src="./js/editor.js"></script>
</body>
</html>
