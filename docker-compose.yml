services:
  frontend:
    build: 
      context: ./app
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - /app/node_modules
    command: sh -c "npx @tailwindcss/cli -i ./css/input.css -o ./css/output.css && (npx @tailwindcss/cli -i ./css/input.css -o ./css/output.css --watch --poll & npx http-server -p 8080 -c-1)"
      - "8000:3000"
    environment:
      DB_HOST: "bdd"
      DB_PORT: "5432"
      DB_USER: "usuario"
      DB_PASS: "contraseña"
      DB_NAME: "bdd"
    depends_on:
      - bdd

  bdd:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "usuario"
      POSTGRES_PASSWORD: "contraseña"
      POSTGRES_DB: "bdd"
    volumes:
      - ./data:/var/lib/postgresql
      - ./01_esquema_bdd.sql:/docker-entrypoint-initdb.d/01_esquema_bdd.sql:ro
      - ./02_seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro