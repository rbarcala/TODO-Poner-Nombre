services:
  frontend:
    build: 
      context: ./app
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - /app/node_modules
    command: sh -c "npx @tailwindcss/cli -i ./css/input.css -o ./css/output.css && (npx @tailwindcss/cli -i ./css/input.css -o ./css/output.css --watch --poll & npx http-server -p \$${PORT:-8080} -c-1)"

  servidor:
    build:
      context: ./servidor
    ports:
      - "8000:3000"
    environment:
      DB_HOST: "bdd"
      DB_PORT: "5432"
      DB_USER: "usuario"
      DB_PASS: "contraseña"
      DB_NAME: "bdd"
    depends_on:
      bdd:
        condition: service_healthy # Asegura que el servidor espere a que Postgres esté 100% listo

  bdd:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "usuario"
      POSTGRES_PASSWORD: "contraseña"
      POSTGRES_DB: "bdd"
    ports:
      - "5432:5432" # Expuesto para conectar clientes como DBeaver o TablePlus desde tu PC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d bdd"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql # Usar un volumen con nombre en vez de ./data evita conflictos de permisos en Linux/Windows
      - ./01_esquema_bdd.sql:/docker-entrypoint-initdb.d/01_esquema_bdd.sql:ro
      - ./02_seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro

volumes:
  postgres_data: